<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="telemetry-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.04); }
    }
    @keyframes traceFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingDot {
      0% { r: 3; opacity: 1; }
      100% { r: 12; opacity: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes signalPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .dynamic-bg-glow {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .dynamic-trace {
      stroke-dasharray: 20, 10;
      animation: traceFlow 14s linear infinite;
    }
    .dynamic-ping {
      animation: pingDot 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .dynamic-signal {
      animation: signalPulse 3s ease-in-out infinite;
    }
    .dynamic-pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .dynamic-pill-2 { animation: floatPill 6s ease-in-out infinite 1.2s; }
    .dynamic-pill-3 { animation: floatPill 5.5s ease-in-out infinite 0.6s; }
    .dynamic-pill-4 { animation: floatPill 6.5s ease-in-out infinite 1.8s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Animated Glow Spheres (Layer 0) -->
  <circle cx="200" cy="100" r="160" fill="#38bdf8" opacity="0.08" class="dynamic-bg-glow" />
  <circle cx="1000" cy="260" r="180" fill="#a855f7" opacity="0.09" class="dynamic-bg-glow" style="animation-delay: -3s;" />
  <circle cx="600" cy="40" r="120" fill="#3b82f6" opacity="0.06" class="dynamic-bg-glow" style="animation-delay: -5s;" />

  <!-- Coordinate Grid Overlay (Layer 1) -->
  <rect width="1200" height="360" rx="16" fill="url(#grid-pattern)" />

  <!-- Animated Telemetry Waveforms / Span Traces (Layer 2 - Behind Text) -->
  <g opacity="0.45">
    <path d="M 0 310 Q 180 250, 360 290 T 720 260 T 1080 300 T 1200 270" fill="none" stroke="#0284c7" stroke-width="2.5" class="dynamic-trace" />
    <path d="M 0 330 Q 240 280, 480 320 T 960 290 T 1200 320" fill="none" stroke="#818cf8" stroke-width="1.8" class="dynamic-trace" style="animation-duration: 20s; animation-direction: reverse;" />
    <path d="M 80 80 L 320 80 L 400 120 L 700 120" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6,6" />
    <path d="M 850 70 L 980 70 L 1040 110 L 1140 110" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6,6" />
  </g>

  <!-- Telemetry Nodes / Pings in Background (Layer 3) -->
  <g>
    <circle cx="400" cy="120" r="4" fill="#38bdf8" />
    <circle cx="400" cy="120" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" class="dynamic-ping" />
    
    <circle cx="1040" cy="110" r="4" fill="#c084fc" />
    <circle cx="1040" cy="110" r="4" fill="none" stroke="#c084fc" stroke-width="1.5" class="dynamic-ping" style="animation-delay: 1.1s;" />

    <circle cx="720" cy="260" r="3.5" fill="#22d3ee" class="dynamic-signal" />
    <circle cx="960" cy="290" r="3.5" fill="#818cf8" class="dynamic-signal" style="animation-delay: 0.8s;" />
  </g>

  <!-- High-Tech Diagnostic Corner Accents -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />
  <path d="M 1170 50 L 1170 30 L 1150 30" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.6" />
  <path d="M 30 310 L 30 330 L 50 330" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />
  <path d="M 1170 310 L 1170 330 L 1150 330" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.6" />

  <!-- Top Badges / Diagnostic Category Pills (Layer 4) -->
  <g class="dynamic-pill-1">
    <rect x="80" y="44" width="220" height="30" rx="15" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="98" cy="59" r="4.5" fill="#22c55e" />
    <text x="112" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">DISTRIBUTED TRACING</text>
  </g>

  <g class="dynamic-pill-2">
    <rect x="315" y="44" width="205" height="30" rx="15" fill="url(#pill-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="333" cy="59" r="4.5" fill="#38bdf8" />
    <text x="347" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">OPENTELEMETRY OTLP</text>
  </g>

  <g class="dynamic-pill-3">
    <rect x="715" y="44" width="210" height="30" rx="15" fill="url(#pill-grad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="733" cy="59" r="4.5" fill="#a855f7" />
    <text x="747" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">SYNTHETIC MONITORING</text>
  </g>

  <g class="dynamic-pill-4">
    <rect x="940" y="44" width="180" height="30" rx="15" fill="url(#pill-grad)" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="958" cy="59" r="4.5" fill="#06b6d4" />
    <text x="972" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">TEST-AWARE APM</text>
  </g>

  <!-- FOREGROUND HERO TYPOGRAPHY (Layer 5 - Crisp & Always In Foreground) -->
  <g id="hero-typography">
    <!-- Super-title / Tag -->
    <text x="600" y="132" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="3.2" text-transform="uppercase">
      CURATED DIRECTORY &amp; ARCHITECTURE GUIDE
    </text>

    <!-- Main Title with Gradient fill and crisp outline -->
    <text x="600" y="186" text-anchor="middle" fill="url(#primary-grad)" filter="url(#subtle-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="39" font-weight="900" letter-spacing="-0.8">
      Test Environment Diagnostics &amp; Telemetry
    </text>
    <text x="600" y="186" text-anchor="middle" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="39" font-weight="900" letter-spacing="-0.8">
      Test Environment Diagnostics &amp; Telemetry
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="228" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" letter-spacing="0.2">
      Full-Stack Test Telemetry, Synthetic Probes, Runner Diagnostics &amp; Root Cause Analysis
    </text>

    <!-- Subtitle Line 2 / Feature Chips -->
    <text x="600" y="260" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.5">
      Selenium 4 Traces • Playwright Probes • Queue Latency • OTLP Backends • Flaky Test Triage
    </text>
  </g>

  <!-- Lower Visual Baseline / Status Indicator -->
  <g transform="translate(460, 298)">
    <rect width="280" height="26" rx="13" fill="#111827" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981" />
    <text x="28" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      CONTINUOUS PIPELINE OBSERVABILITY
    </text>
  </g>
</svg>
